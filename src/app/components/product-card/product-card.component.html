<div class="card-coffee overflow-hidden flex flex-col h-full group">
  <div class="relative h-52 overflow-hidden">
    <img 
      [src]="product.imageUrl" 
      [alt]="product.name"
      class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
    />
    <div class="absolute inset-0 bg-gradient-to-t from-[#1C120B] via-transparent to-transparent"></div>

    <div class="absolute top-3 right-3 bg-black/70 backdrop-blur-md px-3 py-1 rounded-full text-xs text-amber-300 font-bold border border-white/10 flex items-center gap-1 shadow-lg">
      <i class="ri-star-fill text-amber-400"></i>
      <span>{{ product.rating }}</span>
      <span class="text-cream-muted text-[10px] font-normal">({{ product.reviewCount }})</span>
    </div>

    @if (product.roastLevel) {
      <div class="absolute top-3 left-3 bg-amber-500/20 backdrop-blur-md border border-amber-500/40 text-amber-300 px-3 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-wider shadow-md">
        <i class="ri-fire-line text-amber-400 mr-0.5"></i> {{ product.roastLevel }} Roast
      </div>
    }
  </div>

  <div class="p-6 flex flex-col flex-grow justify-between space-y-4">
    <div>
      <div class="flex flex-wrap gap-1.5 mb-2.5">
        @for (tag of product.tags; track tag) {
          <span class="text-[10px] bg-white/5 text-amber-300 border border-white/10 px-2.5 py-0.5 rounded-full font-semibold">
            {{ tag }}
          </span>
        }
      </div>

      <h3 class="font-serif text-xl font-bold text-cream group-hover:text-amber-400 transition-colors line-clamp-1">
        {{ product.name }}
      </h3>
      <p class="text-xs text-cream-muted mt-1.5 line-clamp-2 leading-relaxed font-light">
        {{ product.description }}
      </p>
    </div>

    <div class="pt-4 border-t border-white/10 flex items-center justify-between">
      <div>
        <span class="text-[10px] text-cream-muted uppercase tracking-wider block font-bold">Starting from</span>
        <div class="text-2xl font-extrabold text-amber-400 leading-none">
          {{ currencyService.formatPrice(product.price) }}
        </div>
      </div>

      <button 
        (click)="onSelect.emit(product)"
        class="btn-primary !py-2.5 !px-4 text-xs">
        <i class="ri-options-line"></i> Customize & Add
      </button>
    </div>
  </div>
</div>

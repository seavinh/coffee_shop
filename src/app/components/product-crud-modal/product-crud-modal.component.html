@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in">
    
    <div class="relative w-full max-w-xl glass-panel p-8 rounded-3xl border border-amber-500/30 shadow-2xl space-y-6 max-h-[90vh] overflow-y-auto">
      
      <div class="flex items-center justify-between border-b border-white/10 pb-4">
        <div>
          <span class="badge-gold">Admin CRUD Operation</span>
          <h3 class="font-serif text-2xl font-bold text-cream mt-1">
            {{ product ? 'Edit Product Item' : 'Add New Coffee / Pastry Item' }}
          </h3>
        </div>
        <button (click)="close.emit()" class="text-cream-muted hover:text-white border-0 bg-transparent text-lg cursor-pointer">
          <i class="ri-close-line"></i>
        </button>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-4">
        
        <div>
          <label class="text-[10px] font-bold uppercase tracking-wider text-amber-400 block mb-1">Product Title</label>
          <input 
            type="text" 
            [(ngModel)]="formData.name" 
            name="name" 
            required 
            placeholder="e.g. Ethiopian Guji Honey Cold Brew"
            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2 text-xs text-cream focus:outline-none focus:border-amber-400"
          />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[10px] font-bold uppercase tracking-wider text-amber-400 block mb-1">Price (\$)</label>
            <input 
              type="number" 
              step="0.10" 
              [(ngModel)]="formData.price" 
              name="price" 
              required 
              class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-cream focus:outline-none focus:border-amber-400"
            />
          </div>

          <div>
            <label class="text-[10px] font-bold uppercase tracking-wider text-amber-400 block mb-1">Category</label>
            <select 
              [(ngModel)]="formData.categoryId" 
              name="categoryId"
              class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-cream focus:outline-none focus:border-amber-400">
              @for (cat of categories; track cat.id) {
                <option [value]="cat.id" class="bg-[#1C130D] text-cream">{{ cat.name }}</option>
              }
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[10px] font-bold uppercase tracking-wider text-amber-400 block mb-1">Roast Profile</label>
            <select 
              [(ngModel)]="formData.roastLevel" 
              name="roastLevel"
              class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-cream focus:outline-none focus:border-amber-400">
              <option value="Light" class="bg-[#1C130D]">Light Roast</option>
              <option value="Medium" class="bg-[#1C130D]">Medium Roast</option>
              <option value="Dark" class="bg-[#1C130D]">Dark Roast</option>
              <option value="Omni" class="bg-[#1C130D]">Omni Roast</option>
            </select>
          </div>

          <div>
            <label class="text-[10px] font-bold uppercase tracking-wider text-amber-400 block mb-1">Tags (comma separated)</label>
            <input 
              type="text" 
              [(ngModel)]="tagsString" 
              name="tagsString" 
              placeholder="Bestseller, Organic, Oat Milk"
              class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-cream focus:outline-none focus:border-amber-400"
            />
          </div>
        </div>

        <div>
          <label class="text-[10px] font-bold uppercase tracking-wider text-amber-400 block mb-1">Image URL</label>
          <input 
            type="url" 
            [(ngModel)]="formData.imageUrl" 
            name="imageUrl" 
            required 
            placeholder="https://images.unsplash.com/..."
            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2 text-xs text-cream focus:outline-none focus:border-amber-400"
          />
        </div>

        <div>
          <label class="text-[10px] font-bold uppercase tracking-wider text-amber-400 block mb-1">Description</label>
          <textarea 
            rows="3" 
            [(ngModel)]="formData.description" 
            name="description" 
            required 
            placeholder="Describe origin notes, taste profile, ingredients..."
            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2 text-xs text-cream focus:outline-none focus:border-amber-400">
          </textarea>
        </div>

        <div class="flex items-center gap-6 pt-2">
          <label class="flex items-center gap-2 text-xs text-cream cursor-pointer">
            <input type="checkbox" [(ngModel)]="formData.isAvailable" name="isAvailable" class="accent-amber-500 w-4 h-4"/>
            In Stock / Available
          </label>

          <label class="flex items-center gap-2 text-xs text-cream cursor-pointer">
            <input type="checkbox" [(ngModel)]="formData.isFeatured" name="isFeatured" class="accent-amber-500 w-4 h-4"/>
            Featured on Home Page
          </label>
        </div>

        <div class="pt-4 border-t border-white/10 flex items-center justify-end gap-3">
          <button type="button" (click)="close.emit()" class="btn-secondary text-xs">
            Cancel
          </button>
          <button type="submit" class="btn-primary text-xs">
            <i class="ri-save-line"></i> Save Product
          </button>
        </div>

      </form>
    </div>

  </div>
}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>AURA | Artisan Roastery & Coffee Bar</title>
  <base href="/"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="Experience handcrafted specialty coffee, single-origin brews, and fresh artisanal pastries."/>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,900;1,600&display=swap" rel="stylesheet">
  
  <!-- Remixicon -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            amber: {
              300: '#FFD166',
              400: '#F0A500',
              500: '#E09F3E',
              600: '#C78200'
            },
            cream: {
              DEFAULT: '#FDF8F3',
              muted: '#B8A89A'
            }
          },
          fontFamily: {
            serif: ['Playfair Display', 'Georgia', 'serif'],
            sans: ['Outfit', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0D0704] text-[#FDF8F3] font-sans antialiased selection:bg-amber-500 selection:text-black">
  <app-root></app-root>
</body>
</html>
